<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Wrong Quiz 🛑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="flex items-center justify-center p-4 min-h-screen bg-gradient-to-br from-gray-200 via-gray-300 to-slate-400 font-['Plus_Jakarta_Sans']">

    <div class="bg-white/90 backdrop-blur-md rounded-3xl p-8 sm:p-10 max-w-md w-full text-center shadow-2xl border border-white/50">
        <div class="text-7xl mb-4">🛑</div>
        <h1 class="text-3xl font-extrabold text-gray-800 mb-3">Quiz Access Denied!</h1>
        <p class="text-gray-600 mb-8 leading-relaxed">
            Sorry! This quiz was specially designed exclusively for <span class="font-bold text-gray-800">Mary Jane</span>. Since you're not Mary Jane, this test isn't for you! 
        </p>
        <a href="index.html" class="inline-block py-3 px-8 rounded-full bg-gray-800 text-white font-bold hover:bg-gray-900 transition-colors">
            Try Again 🔄
        </a>
    </div>

</body>
</html>
