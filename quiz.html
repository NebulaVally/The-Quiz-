<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Quick Quiz For You ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            min-height: 100vh;
        }
        .card-shadow {
            box-shadow: 0 20px 50px rgba(235, 87, 87, 0.15);
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">

    <div class="card-shadow bg-white/95 backdrop-blur-md border border-white/40 rounded-3xl p-6 sm:p-10 max-w-md w-full text-center relative overflow-hidden transition-all duration-300">
        
        <!-- Progress Bar -->
        <div id="progress-container" class="w-full bg-gray-100 rounded-full h-2.5 mb-8 overflow-hidden">
            <div id="progress-bar" class="bg-gradient-to-r from-pink-500 to-rose-400 h-2.5 rounded-full transition-all duration-500 w-1/4"></div>
        </div>

        <div id="quiz-box" class="fade-in">
            <!-- Step Badge -->
            <span id="step-badge" class="inline-block px-4 py-1.5 rounded-full text-xs font-bold tracking-wide uppercase bg-pink-100 text-pink-600 mb-4">
                Question 1 of 4
            </span>

            <!-- Question Emoji & Text -->
            <div id="question-emoji" class="text-6xl mb-4 animate-bounce">👋</div>
            <h2 id="question-text" class="text-2xl font-extrabold text-gray-800 mb-6 leading-tight">
                First things first... what is your name?
            </h2>

            <!-- Options Container -->
            <div class="space-y-4">
                <button id="btn-a" onclick="handleOption('A')" class="w-full text-left p-4 rounded-2xl border-2 border-pink-200 bg-gradient-to-r from-pink-50 to-rose-50 hover:from-pink-100 hover:to-rose-100 hover:border-pink-400 transition-all duration-200 group flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <span class="w-8 h-8 rounded-xl bg-pink-500 text-white font-bold flex items-center justify-center text-sm shadow-md group-hover:scale-105 transition-transform">A</span>
                        <span id="text-a" class="font-semibold text-gray-700 group-hover:text-pink-600">Mary Jane</span>
                    </div>
                    <span class="text-pink-400 opacity-0 group-hover:opacity-100 transition-opacity font-bold">✨</span>
                </button>

                <button id="btn-b" onclick="handleOption('B')" class="w-full text-left p-4 rounded-2xl border-2 border-gray-200 bg-gray-50 hover:bg-red-50 hover:border-red-300 transition-all duration-200 group flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <span class="w-8 h-8 rounded-xl bg-gray-400 text-white font-bold flex items-center justify-center text-sm group-hover:bg-red-400 group-hover:scale-105 transition-all">B</span>
                        <span id="text-b" class="font-semibold text-gray-600 group-hover:text-red-500">Not Mary Jane</span>
                    </div>
                    <span class="text-red-400 opacity-0 group-hover:opacity-100 transition-opacity font-bold">❌</span>
                </button>
            </div>
        </div>

        <!-- Success Screen (Replaces Quiz on Q4 Completion) -->
        <div id="success-box" class="hidden fade-in">
            <div class="text-7xl mb-4">🎉💖✨</div>
            <h2 class="text-3xl font-extrabold text-gray-800 mb-3">You Passed!</h2>
            <p class="text-gray-600 mb-8 text-base leading-relaxed">
                4 out of 4 correct answers! Now there's just one tiny official step left...
            </p>
            <a href="https://nebulavally.github.io/Asking-out/" class="inline-block w-full py-4 px-6 rounded-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-extrabold text-lg shadow-lg hover:shadow-pink-500/40 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200">
                Reveal Final Step 💌
            </a>
        </div>

    </div>

    <script>
        let currentStep = 1;

        const questions = [
            {
                step: 1,
                emoji: "👋",
                question: "First things first... what is your name?",
                optionA: "Mary Jane",
                optionB: "Not Mary Jane"
            },
            {
                step: 2,
                emoji: "✨",
                question: "How long have we known each other?",
                optionA: "uhhh, a few months? 🤔",
                optionB: "I don't know 🥲"
            },
            {
                step: 3,
                emoji: "⚡",
                question: "how would you rate our connection so far?",
                optionA: "10/10, we make an incredible team.",
                optionB: "Zero chemistry, complete strangers 🛑"
            },
            {
                step: 4,
                emoji: "💌",
                question: "You're special to me... Am I special to you too?",
                optionA: "YES!",
                optionB: "Hard pass, sorry."
            }
        ];

        function handleOption(choice) {
            if (currentStep === 1 ) {
                if (choice === 'B') {
                    // Redirect immediately if not Mary Jane
                    window.location.href = 'byebye.html';
                    return;
                }
            }
            

            if (currentStep < questions.length) {
                currentStep++;
                renderQuestion();
            } else {
                // Completed Q4 with Option A
                showSuccess();
            }
        }

        function renderQuestion() {
            const quizBox = document.getElementById('quiz-box');
            quizBox.classList.remove('fade-in');
            void quizBox.offsetWidth; // Trigger reflow for animation restart
            quizBox.classList.add('fade-in');

            const q = questions[currentStep - 1];
            
            document.getElementById('step-badge').innerText = `Question ${q.step} of 4`;
            document.getElementById('question-emoji').innerText = q.emoji;
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('text-a').innerText = q.optionA;
            document.getElementById('text-b').innerText = q.optionB;

            // Update progress bar
            const progressPercent = (currentStep / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
        }

        function showSuccess() {
            document.getElementById('progress-container').classList.add('hidden');
            document.getElementById('quiz-box').classList.add('hidden');
            document.getElementById('success-box').classList.remove('hidden');
        }
    </script>
</body>
</html>
